name: Deploy website

# Deploys the Astro site to Cloudflare Workers (uncore.app) when it changes on master.
# Needs the CLOUDFLARE_API_TOKEN repository secret (a token with Workers deploy permission); without it, this skips.

on:
  push:
    branches: [master]
    paths:
      - Web_Services/Frontend/uncore-metrics-astro/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: Web_Services/Frontend/uncore-metrics-astro
    steps:
      - name: Skip without a Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN isn't set, so the website wasn't deployed"
        working-directory: .

      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: pnpm/action-setup@v6
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          version: 12

      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Web_Services/Frontend/uncore-metrics-astro/pnpm-lock.yaml

      - name: Install, test and build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec wrangler deploy
