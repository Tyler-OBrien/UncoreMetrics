version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # EFCore.BulkExtensions has no EF Core 11 release yet, so EF Core and Npgsql stay on 10
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: [">=11.0.0-0"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        versions: [">=11.0.0-0"]

  - package-ecosystem: npm
    directory: /Web_Services/Frontend/uncore-metrics-astro
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/preact supports preact 10 only; @astrojs/check supports TypeScript 5-6 only
      - dependency-name: preact
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
